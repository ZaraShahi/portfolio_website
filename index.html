<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zara Shahi</title>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&family=Playfair+Display:wght@600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=modular-artworks" />
  <script data-goatcounter="https://zar-shahi.goatcounter.com/count" data-goatcounter-settings='{"allow_local": true}'
    async src="//gc.zgo.at/count.js"></script>
</head>

<body>
  <header class="nav">
    <a class="nav__brand" href="#top">Zara Shahi</a>
    <nav class="nav__links">
      <a href="#artworks">Artwork</a>
      <a href="#about">About</a>
      <a href="#cv">CV</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="home-page">
    <div id="top"></div>

    <noscript>
      <p class="section-message">Please enable JavaScript to view the artwork, About, and CV sections.</p>
    </noscript>

    <section class="home-section home-section--artworks" id="artworks">
      <h1 class="section-heading">Artwork</h1>
      <div data-section-src="sections/artworks/weaving.html"></div>
      <div data-section-src="sections/artworks/photography.html"></div>
    </section>

    <div data-section-src="sections/about.html"></div>

    <div data-section-src="sections/cv.html"></div>

    <section class="panel panel--dark reveal" id="contact">
      <div class="panel__content">
        <div class="panel__tag">Contact</div>
        <div class="contact contact--bar">
          <div class="contact__line">
            <div class="contact__primary">
              <div class="contact__item">
                <svg class="contact__inline-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 7.5h16v9H4z" stroke="currentColor" stroke-width="1.6" fill="none" />
                  <path d="M4 7.5l8 6 8-6" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"
                    stroke-linejoin="round" />
                </svg>
                <a class="contact__link contact__value" href="mailto:imzarashahi@gmail.com">imzarashahi@gmail.com</a>
              </div>
              <div class="contact__item">
                <svg class="contact__inline-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 21s6-6.2 6-11a6 6 0 10-12 0c0 4.8 6 11 6 11z" stroke="currentColor" stroke-width="1.6"
                    fill="none" stroke-linecap="round" stroke-linejoin="round" />
                  <circle cx="12" cy="10" r="2.6" stroke="currentColor" stroke-width="1.6" fill="none" />
                </svg>
                <a class="contact__link contact__value" href="https://maps.google.com/?q=Dartmouth%2C%20MA"
                  target="_blank" rel="noopener">Dartmouth, MA</a>
              </div>
            </div>
            <div class="contact__social">
              <a class="contact__social-link" href="https://instagram.com/zara.shahi.art" target="_blank" rel="noopener"
                aria-label="Instagram">
                <svg class="contact__social-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5.2" y="5.2" width="13.6" height="13.6" rx="4" stroke="currentColor" stroke-width="1.6"
                    fill="none" />
                  <circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.6" fill="none" />
                  <circle cx="16.4" cy="7.6" r="1" fill="currentColor" />
                </svg>
                <span class="visually-hidden">Instagram</span>
              </a>
              <a class="contact__social-link" href="https://www.linkedin.com/in/zara-shahi" target="_blank"
                rel="noopener" aria-label="LinkedIn">
                <svg class="contact__social-icon" viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="5.2" y="5.2" width="13.6" height="13.6" rx="3" stroke="currentColor" stroke-width="1.6"
                    fill="none" />
                  <path d="M9 11v6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
                  <path d="M9 9.2h.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                  <path d="M12 17v-3.5c0-1.3.8-2.4 2.2-2.4s2.2 1.1 2.2 2.4V17" stroke="currentColor" stroke-width="1.6"
                    fill="none" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span class="visually-hidden">LinkedIn</span>
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div>© Zara Shahi — 2026</div>
    <div class="footer__links">
      <a href="#top">Back to top</a>
    </div>
  </footer>

  <script src="script.js?v=modular-artworks"></script>
</body>

</html>
