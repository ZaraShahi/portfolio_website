<section class="artwork-section reveal" id="installation" aria-labelledby="installation-heading">
  <h2 class="artwork-section__heading" id="installation-heading">Installation</h2>
  <div class="portfolio-carousel">
    <button class="portfolio-carousel__arrow portfolio-carousel__arrow--prev" type="button"
      aria-label="Scroll installation artworks left" aria-controls="installation-track">&#8249;</button>
    <div class="portfolio-grid portfolio-grid--carousel" id="installation-track" aria-label="Installation artworks">
      <!-- Images use Google Drive thumbnail links: https://drive.google.com/thumbnail?id=FILE_ID&amp;sz=s0
        A video slide is a Drive file link, https://drive.google.com/file/d/FILE_ID/view, of an H.264 .mp4;
        the site streams it from Drive into its own player. Optional on the tile:
          data-video-webm   Drive link of a VP9 .webm copy (for browsers without H.264, e.g. VS Code's)
          data-video-poster still shown before playing (default: Drive's thumbnail of the video)
          data-video-ratio  width / height of the video (portrait phone video: 9 / 16) -->
      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open An Ocean Between Us artwork"
        data-caption="An Ocean Between Us, 2026, monofilament thread, silk yarn, floor loom reed, video, and sound"
        data-slides="https://drive.google.com/thumbnail?id=1_cMCAlrHzmXIR3nxYjcJPzRXxUw91HSv&amp;sz=s0|https://drive.google.com/file/d/1ZR3tiws2f4Mwa5_de-xokCaX9a9adaDb/view"
        data-video-ratio="9 / 16">
        <img src="https://drive.google.com/thumbnail?id=1_cMCAlrHzmXIR3nxYjcJPzRXxUw91HSv&amp;sz=s0" referrerpolicy="no-referrer" alt="An Ocean Between Us installation by Zara Shahi"
          loading="lazy" decoding="async" />
        <span class="portfolio-tile__badge" aria-hidden="true">Video</span>
      </button>
      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open Traces of Home artwork"
        data-caption="Traces of Home (in progress), 2026, photography, handmade abaca paper, and metal"
        data-slides="https://drive.google.com/thumbnail?id=178--rT6y0N4-r2ARAybLpx2MhDWDXszb&amp;sz=s0|https://drive.google.com/thumbnail?id=1IxaWH_PsAPtIHP-VqAwCquta459NpByb&amp;sz=s0|https://drive.google.com/thumbnail?id=1eB9kOhiCxPMDMOs1q9LsQLqKBUvqLKqC&amp;sz=s0">
        <img src="https://drive.google.com/thumbnail?id=178--rT6y0N4-r2ARAybLpx2MhDWDXszb&amp;sz=s0" referrerpolicy="no-referrer" alt="Traces of Home installation by Zara Shahi"
          loading="lazy" decoding="async" />
      </button>
    </div>
    <button class="portfolio-carousel__arrow portfolio-carousel__arrow--next" type="button"
      aria-label="Scroll installation artworks right" aria-controls="installation-track">&#8250;</button>
  </div>
</section>
