<section class="artwork-section reveal" id="photography" aria-labelledby="photography-heading">

      aria-label="Scroll photography artworks left" aria-controls="photography-track">&#8249;</button>
    <div class="portfolio-grid portfolio-grid--carousel" id="photography-track" aria-label="Photography artworks">

      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open Artwork Title artwork"

        data-slides="assets/images/photo-1.jpg|assets/images/photo-2.jpg">
        <img src="assets/images/photo-1.jpg" alt="Artwork Title by Zara Shahi" loading="lazy" decoding="async" />
      </button>
      -->
      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open Hold It artwork"
        data-caption="Hold It, 2024"

        <img src="https://drive.google.com/thumbnail?id=156wO6ndOoxmUKWGwsmfghTBIkp4iTGmg&sz=s0"

      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open Remnants of Belonging artwork"
        data-caption="Remnants of Belonging, 2026"

        data-caption="Untitled, 2026"
        data-slides="https://drive.google.com/thumbnail?id=1Jk9EkQ5_bfbH-vKvSk8_8KRNoEfiQm72&sz=s0|https://drive.google.com/thumbnail?id=1Z6AYx3EQ9TVCY0udIGnYFFGKOhNKoL43&sz=s0|https://drive.google.com/thumbnail?id=1OUTwGbrZmTioEoIASI66mU-g_YU2gOD5&sz=s0|https://drive.google.com/thumbnail?id=11hU7kwOKFRTB8_WXx99DuTbji_clMg-t&sz=s0">
