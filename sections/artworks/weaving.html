<section class="artwork-section reveal" id="weaving" aria-labelledby="weaving-heading">
  <h2 class="artwork-section__heading" id="weaving-heading">Weaving</h2>
  <div class="portfolio-carousel">
    <button class="portfolio-carousel__arrow portfolio-carousel__arrow--prev" type="button"
      aria-label="Scroll weaving artworks left" aria-controls="weaving-track">‹</button>
    <div class="portfolio-grid portfolio-grid--carousel" id="weaving-track" aria-label="Weaving artworks">
      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open In Between artwork"
        data-caption="In Between, 2025, silk, monofilament, and cotton"
        data-slides="assets/images/in-between-1.jpg|assets/images/in-between-2.jpg|assets/images/in-between-3.jpg">
        <img src="assets/images/in-between-1.jpg" alt="In Between artwork by Zara Shahi" decoding="async"
          fetchpriority="high" />
      </button>
      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open Wound artwork"
        data-caption="Wound, 2025, silk, linen, cotton, metal, and wood"
        data-slides="assets/images/wound-1.jpg|assets/images/wound-2.jpg">
        <img src="assets/images/wound-1.jpg" alt="Wound artwork by Zara Shahi" decoding="async"
          fetchpriority="high" />
      </button>
      <button class="portfolio-tile portfolio-tile--image" type="button"
        aria-label="Open Unforgotten Memories artwork"
        data-caption="Unforgotten Memories, 2025, silk, linen, cotton, and wood"
        data-slides="assets/images/unforgotten-memories-1.jpg|assets/images/unforgotten-memories-2.jpg|assets/images/unforgotten-memories-4.jpg|assets/images/unforgotten-memories-3.jpg|assets/images/unforgotten-memories-5.jpg">
        <img src="assets/images/unforgotten-memories-1.jpg" alt="Unforgotten Memories artwork by Zara Shahi"
          decoding="async" fetchpriority="high" />
      </button>
      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open Rupture artwork"
        data-caption="Rupture, 2025, silk, linen, cotton, and metal"
        data-slides="assets/images/rupture-1.jpg|assets/images/rupture-2.jpg|assets/images/rupture-3.jpg">
        <img src="assets/images/rupture-1.jpg" alt="Rupture artwork by Zara Shahi" decoding="async"
          fetchpriority="high" />
      </button>
      <button class="portfolio-tile portfolio-tile--image" type="button"
        aria-label="Open One Body, Two Worlds artwork"
        data-caption="One Body, Two Worlds, 2025, silk, linen, cotton, and wood"
        data-slides="assets/images/One-Body,Two-Worlds-1.jpg|assets/images/One-Body,Two-Worlds-2.jpg">
        <img src="assets/images/One-Body,Two-Worlds-1.jpg" alt="One Body, Two Worlds artwork by Zara Shahi"
          decoding="async" fetchpriority="high" />
      </button>
    </div>
    <button class="portfolio-carousel__arrow portfolio-carousel__arrow--next" type="button"
      aria-label="Scroll weaving artworks right" aria-controls="weaving-track">›</button>
  </div>
</section>
