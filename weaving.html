<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weaving Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=artwork-four-square" />
</head>
<body>
  <header class="nav">
    <a class="nav__brand" href="index.html#top">Zara Shahi</a>
    <nav class="nav__links">
      <a href="index.html#artworks">Artwork</a>
      <a href="index.html#about">About</a>
      <a href="index.html#cv">CV</a>
      <a href="index.html#contact">Contact</a>
    </nav>
  </header>

  <main class="portfolio-page">
    <section class="portfolio-grid reveal" aria-label="Weaving works grid">
      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open woven textile artwork" data-caption="In Between, 2025, silk, monofilament, and cotton" data-slides="assets/images/in-between-1.jpg|assets/images/in-between-2.jpg|assets/images/in-between-3.jpg">
        <img src="assets/images/in-between-1.jpg" alt="Woven textile artwork by Zara Shahi" decoding="async" fetchpriority="high" />
      </button>
      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open Unforgotten Memories artwork" data-caption="Unforgotten Memories, 2025, silk, linen, cotton, and wood" data-slides="assets/images/unforgotten-memories-1.jpg|assets/images/unforgotten-memories-2.jpg|assets/images/unforgotten-memories-4.jpg|assets/images/unforgotten-memories-3.jpg|assets/images/unforgotten-memories-5.jpg">
        <img src="assets/images/unforgotten-memories-1.jpg" alt="Unforgotten Memories artwork by Zara Shahi" decoding="async" fetchpriority="high" />
      </button>
      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open Wound artwork" data-caption="Wound, 2025, silk, linen, cotton, metal, and wood" data-slides="assets/images/wound-1.jpg|assets/images/wound-2.jpg">
        <img src="assets/images/wound-1.jpg" alt="Wound artwork by Zara Shahi" decoding="async" fetchpriority="high" />
      </button>
      <button class="portfolio-tile portfolio-tile--image" type="button" aria-label="Open Rupture artwork" data-caption="Rupture, 2025, silk, linen, cotton, and metal" data-slides="assets/images/rupture-1.jpg|assets/images/rupture-2.jpg|assets/images/rupture-3.jpg">
        <img src="assets/images/rupture-1.jpg" alt="Rupture artwork by Zara Shahi" decoding="async" fetchpriority="high" />
      </button>
      <div class="portfolio-tile"></div>
      <div class="portfolio-tile"></div>
      <div class="portfolio-tile"></div>
      <div class="portfolio-tile"></div>
      <div class="portfolio-tile"></div>
      <div class="portfolio-tile"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
